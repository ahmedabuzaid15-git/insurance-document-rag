# Gold evaluation set for retrieval quality and hallucination-guard testing.
#
# Answerable questions (unanswerable: false) carry the one document that
# genuinely contains the fact, generated deterministically by
# src/generate_documents.py. Retrieval scoring checks whether that doc_id
# appears in the top-k results (hit rate) and at what rank (MRR).
#
# Unanswerable questions ask about benefits that do not exist anywhere in the
# synthetic corpus (flight delay, legal liability, funeral expense are never
# mentioned in any generated section). These are used by the hallucination
# -guard test, not by hit-rate/MRR, since there is no correct source to hit.

